name: Build HDDIndexer Windows App

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.txt'
      - 'LICENSE'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '*.txt'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Release]
        platform: [x64, x86]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.nuget/packages
          ~/.local/share/NuGet/v3-cache
          ${{ github.workspace }}/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Cache .NET tools and SDK
      uses: actions/cache@v4
      with:
        path: |
          ~/.dotnet
          ${{ env.DOTNET_ROOT }}
        key: dotnet-sdk-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          dotnet-sdk-${{ runner.os }}-

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Display environment info
      run: |
        echo "=== Environment Information ==="
        dotnet --info
        echo ""
        echo "=== MSBuild version ==="
        msbuild -version
        echo ""
        echo "=== Windows SDK versions ==="
        if (Test-Path "C:\Program Files (x86)\Windows Kits\10\Include") {
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select-Object Name
        } else {
          echo "Windows Kits not found"
        }
        echo ""
        echo "=== Project file content ==="
        Get-Content src\HDDIndexer\HDDIndexer.csproj
        echo ""
        echo "=== Checking for Package.appxmanifest ==="
        if (Test-Path "src\HDDIndexer\Package.appxmanifest") {
          echo "Package.appxmanifest found:"
          Get-Content src\HDDIndexer\Package.appxmanifest
        } else {
          echo "Package.appxmanifest not found"
        }
        echo ""
        echo "=== Current working directory contents ==="
        Get-ChildItem -Recurse -File | Select-Object -First 20 | ForEach-Object { $_.FullName }
        echo ""

    - name: Restore dependencies
      run: |
        echo "=== Starting dependency restore ==="
        dotnet restore src/HDDIndexer/HDDIndexer.csproj --verbosity detailed --no-cache --force
        echo "=== Restore completed ==="

    - name: Verify XAML files
      run: |
        echo "=== Checking XAML files for common issues ==="
        $xamlIssues = Select-String -Path "src\HDDIndexer\**\*.xaml" -Pattern "(UniformGrid|WrapPanel|Toolkit:)" -AllMatches
        if ($xamlIssues) {
          echo "WARNING: Found potentially incompatible controls in XAML files:"
          $xamlIssues | ForEach-Object { echo "$($_.Filename):$($_.LineNumber): $($_.Line.Trim())" }
        } else {
          echo "No obviously incompatible controls found in XAML"
        }
        echo ""
        echo "=== XAML files list ==="
        Get-ChildItem -Path "src\HDDIndexer" -Filter "*.xaml" -Recurse | ForEach-Object { $_.FullName }
        echo ""

    - name: Build application
      run: |
        echo "=== Starting build process ==="
        echo "Configuration: ${{ matrix.configuration }}"
        echo "Platform: ${{ matrix.platform }}"
        echo ""
        dotnet build src/HDDIndexer/HDDIndexer.csproj -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} --verbosity detailed
        if ($LASTEXITCODE -ne 0) {
          echo ""
          echo "=== BUILD FAILED - Additional debugging info ==="
          echo "Exit code: $LASTEXITCODE"
          echo ""
          echo "=== Checking for build logs ==="
          if (Test-Path "src\HDDIndexer\obj") {
            echo "Build object directory contents:"
            Get-ChildItem -Path "src\HDDIndexer\obj" -Recurse | ForEach-Object { $_.FullName }
          }
          echo ""
          echo "=== Checking for XAML compilation errors ==="
          Get-ChildItem -Path "src\HDDIndexer\obj" -Recurse -Filter "*.json" | ForEach-Object {
            echo "File: $($_.FullName)"
            Get-Content $_.FullName
            echo "---"
          }
          exit $LASTEXITCODE
        }
        echo "=== Build process completed successfully ==="

    - name: Publish self-contained application
      run: |
        echo "=== Starting publish process ==="
        echo "Target runtime: win10-${{ matrix.platform }}"
        echo "Output directory: publish-${{ matrix.platform }}"
        echo ""
        dotnet publish src/HDDIndexer/HDDIndexer.csproj -c ${{ matrix.configuration }} -r win10-${{ matrix.platform }} --self-contained true --no-build -o publish-${{ matrix.platform }} --verbosity detailed
        if ($LASTEXITCODE -ne 0) {
          echo ""
          echo "=== PUBLISH FAILED - Exit code: $LASTEXITCODE ==="
          exit $LASTEXITCODE
        }
        echo ""
        echo "=== Publish output contents ==="
        if (Test-Path "publish-${{ matrix.platform }}") {
          Get-ChildItem -Path "publish-${{ matrix.platform }}" -Recurse | ForEach-Object { $_.FullName }
        } else {
          echo "ERROR: Publish output directory does not exist!"
          exit 1
        }
        echo "=== Publish process completed successfully ==="

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: HDDIndexer-${{ matrix.platform }}-${{ matrix.configuration }}
        path: publish-${{ matrix.platform }}/
        retention-days: 30
        compression-level: 6
        if-no-files-found: error

    - name: Create MSIX package (x64 only)
      if: matrix.platform == 'x64'
      run: |
        echo "=== Starting MSIX package creation ==="
        echo "Configuration: ${{ matrix.configuration }}"
        echo "Platform: ${{ matrix.platform }}"
        echo ""
        echo "=== MSIX build command ==="
        echo "dotnet publish src/HDDIndexer/HDDIndexer.csproj -c ${{ matrix.configuration }} -r win10-${{ matrix.platform }} --self-contained true --no-build -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -o msix-output --verbosity detailed"
        echo ""
        dotnet publish src/HDDIndexer/HDDIndexer.csproj -c ${{ matrix.configuration }} -r win10-${{ matrix.platform }} --self-contained true --no-build -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false -o msix-output --verbosity detailed
        if ($LASTEXITCODE -ne 0) {
          echo ""
          echo "=== MSIX CREATION FAILED - Exit code: $LASTEXITCODE ==="
          echo "=== Checking for MSIX-specific errors ==="
          if (Test-Path "src\HDDIndexer\obj") {
            echo "Looking for Package.appxmanifest errors:"
            Get-ChildItem -Path "src\HDDIndexer\obj" -Recurse -Filter "*appx*" | ForEach-Object {
              echo "File: $($_.FullName)"
              if ($_.Extension -eq ".log") {
                Get-Content $_.FullName | Select-Object -Last 50
              }
            }
          }
          exit $LASTEXITCODE
        }
        echo ""
        echo "=== MSIX output contents ==="
        if (Test-Path "msix-output") {
          Get-ChildItem -Path "msix-output" -Recurse | ForEach-Object { $_.FullName }
        } else {
          echo "ERROR: MSIX output directory does not exist!"
          exit 1
        }
        echo "=== MSIX package creation completed successfully ==="

    - name: Upload MSIX artifacts
      if: matrix.platform == 'x64'
      uses: actions/upload-artifact@v4
      with:
        name: HDDIndexer-MSIX-${{ matrix.configuration }}
        path: msix-output/
        retention-days: 30
        compression-level: 6
        if-no-files-found: error

  release:
    needs: build
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip release]')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download x64 artifacts
      uses: actions/download-artifact@v4
      with:
        name: HDDIndexer-x64-Release
        path: release/x64/

    - name: Download x86 artifacts
      uses: actions/download-artifact@v4
      with:
        name: HDDIndexer-x86-Release
        path: release/x86/

    - name: Download MSIX artifacts
      uses: actions/download-artifact@v4
      with:
        name: HDDIndexer-MSIX-Release
        path: release/msix/

    - name: Create release archives
      run: |
        Compress-Archive -Path "release/x64/*" -DestinationPath "HDDIndexer-x64.zip" -CompressionLevel Optimal
        Compress-Archive -Path "release/x86/*" -DestinationPath "HDDIndexer-x86.zip" -CompressionLevel Optimal
        if (Test-Path "release/msix") {
          Compress-Archive -Path "release/msix/*" -DestinationPath "HDDIndexer-MSIX.zip" -CompressionLevel Optimal
        }

    - name: Generate version tag
      id: version
      run: |
        $timestamp = Get-Date -Format "yyyy.MM.dd.HHmm"
        echo "tag=v$timestamp" >> $env:GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: HDDIndexer Release ${{ steps.version.outputs.tag }}
        draft: false
        prerelease: false
        files: |
          HDDIndexer-x64.zip
          HDDIndexer-x86.zip
          HDDIndexer-MSIX.zip
        body: |
          ## HDDIndexer Windows Application

          **Release Date:** ${{ steps.version.outputs.tag }}

          ### Downloads
          - `HDDIndexer-x64.zip` - 64-bit Windows application
          - `HDDIndexer-x86.zip` - 32-bit Windows application
          - `HDDIndexer-MSIX.zip` - Microsoft Store package (unsigned)

          ### Installation
          1. Download the appropriate ZIP file for your system
          2. Extract all files to a folder
          3. Run `HDDIndexer.exe`

          ### System Requirements
          - Windows 10 version 1809 (build 17763) or later
          - Windows 11 (any version)
          - .NET 6 runtime (included in self-contained builds)

          🤖 Generated with GitHub Actions
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}