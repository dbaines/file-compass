name: Build

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  publish-linux:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish src/FileCompass.Desktop/FileCompass.Desktop.csproj -c Release -r linux-x64 --self-contained -o ./publish

      - name: Rename executable
        run: mv ./publish/FileCompass ./publish/FileCompass-linux-x64-0.1.0

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileCompass-linux-x64-0.1.0
          path: ./publish

  publish-windows:
    needs: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish src/FileCompass.Desktop/FileCompass.Desktop.csproj -c Release -r win-x64 --self-contained -o ./publish

      - name: Rename executable
        run: ren .\publish\FileCompass.exe FileCompass-win-x64-0.1.0.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileCompass-win-x64-0.1.0
          path: ./publish
